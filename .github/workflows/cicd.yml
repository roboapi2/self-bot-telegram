name: Docker CI and production
'on':
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      image_digest:
        description: 'Optional verified sha256: digest; blank builds the selected main/version ref'
        required: false
        type: string
permissions:
  contents: read
  packages: read
env:
  IMAGE: ghcr.io/roboapi2/self-bot-telegram
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Contracts and tracked private files
        run: |
          python3 -m venv "$RUNNER_TEMP/contracts"
          "$RUNNER_TEMP/contracts/bin/pip" install PyYAML==6.0.3
          "$RUNNER_TEMP/contracts/bin/python" tests/docker_contracts.py
          "$RUNNER_TEMP/contracts/bin/python" tests/smoke_diagnostics.py
      - name: Secret scan (redacted)
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f dir /repo --redact --no-banner
      - name: PHP Linux tests and dependency audit
        run: |
          test ! -e docker/private-context-fixture
          test ! -e scripts/docker/private-context-fixture
          printf 'PRIVATE_CONTEXT_CANARY' > docker/private-context-fixture
          printf 'PRIVATE_CONTEXT_CANARY' > scripts/docker/private-context-fixture
          docker build --target source -t ubcc-context .
          docker run --rm --entrypoint sh ubcc-context -ec 'test ! -e /build/docker/private-context-fixture; test ! -e /build/scripts/docker/private-context-fixture; test ! -e /build/config.php; test ! -e /build/accounts.json; test ! -d /build/.git'
          rm docker/private-context-fixture scripts/docker/private-context-fixture
          docker build --pull --target ci -t ubcc-ci .
          docker run --rm ubcc-ci bash scripts/test.sh
          docker run --rm -e UBCC_ISOLATED_DEPLOY_TEST=1 ubcc-ci bash tests/docker_deploy.sh
          docker run --rm ubcc-ci composer audit --locked --no-dev
          docker run --rm ubcc-ci python3 tests/ignore_release.py
      - name: Build exact candidate
        run: docker build --target runtime --build-arg VCS_REF="$GITHUB_SHA" -t ubcc-candidate .
      - name: Image vulnerability gate
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.cache/trivy:/root/.cache/" aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed ubcc-candidate
      - name: Runtime Compose smoke and privacy
        run: |
          bash scripts/docker/ci-smoke.sh ubcc-candidate
          CADDY_IMAGE=$(sed -n 's/^    image: \(caddy:.*\)$/\1/p' compose.production.yml)
          test -n "$CADDY_IMAGE"
          docker run --rm --read-only --user 10001:10001 --tmpfs /data:mode=1777 --tmpfs /config:mode=1777 --tmpfs /tmp:mode=1777 -e DOMAIN=ci.example.invalid -e ACME_EMAIL=ci@example.invalid -v "$PWD/docker/Caddyfile:/etc/caddy/Caddyfile:ro" "$CADDY_IMAGE" caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker run --rm aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$CADDY_IMAGE"
      - name: Verify requested manual digest
        if: github.event_name == 'workflow_dispatch' && inputs.image_digest != ''
        env: {REQUESTED: '${{ inputs.image_digest }}'}
        run: |
          [[ "$REQUESTED" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s' '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          docker pull "$IMAGE@$REQUESTED"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$IMAGE@$REQUESTED"
          bash scripts/docker/ci-smoke.sh "$IMAGE@$REQUESTED"
      - name: Create clean deployment artifact
        run: |
          export SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")
          python3 scripts/build-release.py "ubcc-$GITHUB_SHA"
          python3 tests/ignore_release.py --archive "releases/ubcc-$GITHUB_SHA.tar.gz"
          docker save ubcc-candidate -o "$RUNNER_TEMP/image.tar"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-candidate
          path: |
            ${{ runner.temp }}/image.tar
            releases/ubcc-*.tar.gz
            releases/ubcc-*.tar.gz.sha256
          retention-days: 3
          if-no-files-found: error
  publish:
    needs: validate
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && inputs.image_digest == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions: {contents: write, packages: write}
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    concurrency:
      group: publish-${{ github.repository }}-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: verified-candidate, path: candidate}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - id: publish
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          FILE=$(find candidate -name image.tar -print -quit)
          docker load -i "$FILE"
          TAG="sha-$GITHUB_SHA"
          if docker buildx imagetools inspect "$IMAGE:$TAG" >/dev/null 2>&1; then
            DIGEST=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}' | jq -r .digest)
            docker pull "$IMAGE@$DIGEST"
            [[ $(docker inspect "$IMAGE@$DIGEST" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}') == "$GITHUB_SHA" ]]
          else
            docker tag ubcc-candidate "$IMAGE:$TAG"
            docker push "$IMAGE:$TAG"
            DIGEST=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}' | jq -r .digest)
          fi
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker pull "$IMAGE@$DIGEST"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$IMAGE@$DIGEST"
          bash scripts/docker/ci-smoke.sh "$IMAGE@$DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          printf '%s@%s\n' "$IMAGE" "$DIGEST" > candidate/IMAGE_DIGEST.txt
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            if docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
              EXISTING=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
              [[ "$EXISTING" == "$DIGEST" ]]
            else
              docker buildx imagetools create --prefer-index=false -t "$IMAGE:$VERSION" "$IMAGE@$DIGEST"
            fi
          else
            exit 0
          fi
          mapfile -t ASSETS < <(find candidate -type f \( -name '*.tar.gz' -o -name '*.tar.gz.sha256' -o -name IMAGE_DIGEST.txt \))
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" --verify-tag --title "$VERSION" --notes-file CHANGELOG.md "${ASSETS[@]}"
          fi
  rolling:
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {contents: write, packages: write}
    concurrency: {group: 'continuous-${{ github.repository }}', cancel-in-progress: false}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with: {name: verified-candidate, path: candidate}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - env: {GH_TOKEN: '${{ github.token }}', DIGEST: '${{ needs.publish.outputs.digest }}'}
        run: |
          set -euo pipefail
          HEAD=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          [[ "$HEAD" == "$GITHUB_SHA" ]] || exit 0
          docker buildx imagetools create --prefer-index=false -t "$IMAGE:edge" "$IMAGE@$DIGEST"
          printf '%s@%s\n' "$IMAGE" "$DIGEST" > candidate/IMAGE_DIGEST.txt
          if gh release view continuous >/dev/null 2>&1; then
            gh release edit continuous --target "$GITHUB_SHA" --prerelease --title 'Continuous verified deployment' --notes-file CHANGELOG.md
          else
            gh release create continuous --target "$GITHUB_SHA" --prerelease --title 'Continuous verified deployment' --notes-file CHANGELOG.md
          fi
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/continuous" -f sha="$GITHUB_SHA" -F force=true
          gh release view continuous --json assets --jq '.assets[].name' | while read -r asset; do gh release delete-asset continuous "$asset" --yes; done
          mapfile -t ASSETS < <(find candidate -type f \( -name '*.tar.gz' -o -name '*.tar.gz.sha256' -o -name IMAGE_DIGEST.txt \))
          gh release upload continuous "${ASSETS[@]}"
  deploy:
    needs: [validate, publish, rolling]
    if: >-
      always() && needs.validate.result == 'success' &&
      (needs.publish.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.image_digest != '')) &&
      (needs.rolling.result == 'success' || github.ref != 'refs/heads/main' || inputs.image_digest != '') &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions: {contents: read}
    concurrency:
      group: production-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Deploy exact verified digest over pinned SSH
        env:
          DIGEST: ${{ needs.publish.outputs.digest || inputs.image_digest }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ && "$VPS_USER" == ubcc-deploy && "$VPS_PORT" =~ ^[0-9]{1,5}$ ]]
          ((VPS_PORT > 0 && VPS_PORT <= 65535))
          install -d -m 0700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/ssh/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/ssh/"*
          ssh -i "$RUNNER_TEMP/ssh/key" -p "$VPS_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -o ConnectTimeout=30 -o ServerAliveInterval=15 "$VPS_USER@$VPS_HOST" "sudo -n /usr/local/sbin/ubcc-deploy '$IMAGE@$DIGEST' '$GITHUB_RUN_NUMBER'"
