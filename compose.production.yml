name: ubcc
x-app: &app
  image: ${UBCC_IMAGE:?Use a verified image digest}
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
  stop_grace_period: 140s
  tmpfs: ["/tmp:rw,noexec,nosuid,size=256m,mode=1777"]
  logging: &logging
    driver: json-file
    options: {max-size: "10m", max-file: "5"}
  networks: [backend]
x-storage: &storage
  - type: bind
    source: ${UBCC_ROOT:-/opt/ubcc}/data/accounts
    target: /opt/app/accounts
    bind: {create_host_path: false}
  - type: bind
    source: ${UBCC_ROOT:-/opt/ubcc}/data/panel
    target: /opt/app/.panel
    bind: {create_host_path: false}
  - type: bind
    source: ${UBCC_ROOT:-/opt/ubcc}/secrets/config.php
    target: /run/secrets/config.php
    read_only: true
    bind: {create_host_path: false}
services:
  runtime:
    <<: *app
    command: [namespace]
    pids_limit: 64
    healthcheck:
      test: [CMD-SHELL, "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 3
  supervisor:
    <<: *app
    command: [supervisor]
    pid: service:runtime
    pids_limit: 512
    volumes: *storage
    env_file: ${UBCC_ROOT:-/opt/ubcc}/secrets/app.env
    environment: {UBCC_PROCESS_MODE: supervisor, UBCC_PHP_BIN: /usr/local/bin/php}
    depends_on: {runtime: {condition: service_healthy}}
    healthcheck:
      test: [CMD, php, /opt/app/docker/health.php, supervisor]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 6
  web:
    <<: *app
    command: [web]
    pid: service:runtime
    pids_limit: 256
    volumes: *storage
    env_file: ${UBCC_ROOT:-/opt/ubcc}/secrets/app.env
    environment: {UBCC_PROCESS_MODE: supervisor, UBCC_PHP_BIN: /usr/local/bin/php}
    depends_on: {supervisor: {condition: service_healthy}}
    healthcheck:
      test: [CMD, php, /opt/app/docker/health.php, web]
      interval: 15s
      timeout: 5s
      retries: 6
  nginx:
    <<: *app
    command: [nginx]
    pids_limit: 128
    networks: [backend, frontend]
    depends_on: {web: {condition: service_healthy}}
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8080/healthz]
      interval: 15s
      timeout: 5s
      retries: 6
  gateway:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 30s
    pids_limit: 128
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,mode=1777"]
    logging: *logging
    ports: ["80:8080", "443:8443"]
    networks: [frontend]
    environment: {DOMAIN: "${DOMAIN:?Set your domain}", ACME_EMAIL: "${ACME_EMAIL:?Set ACME email}"}
    volumes:
      - type: bind
        source: ${UBCC_ROOT:-/opt/ubcc}/docker/Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${UBCC_ROOT:-/opt/ubcc}/data/caddy
        target: /data
        bind: {create_host_path: false}
      - type: bind
        source: ${UBCC_ROOT:-/opt/ubcc}/data/caddy-config
        target: /config
        bind: {create_host_path: false}
    depends_on: {nginx: {condition: service_healthy}}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:2016/healthz]
      interval: 15s
      timeout: 5s
      retries: 6
networks:
  backend: {}
  frontend: {}
