worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client;
    fastcgi_temp_path /tmp/fastcgi;
    limit_req_zone $binary_remote_addr zone=ubcc_login:10m rate=10r/m;
    server {
        listen 8080;
        root /opt/app/public;
        client_max_body_size 1m;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        location = /healthz { return 200 'ok'; }
        location = / { rewrite ^ /index.php last; }
        location = /index.php {
            limit_req zone=ubcc_login burst=10 nodelay;
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /opt/app/index.php;
            fastcgi_param HTTPS on;
            fastcgi_pass web:9000;
            fastcgi_read_timeout 120s;
        }
        location = /api.php {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /opt/app/api.php;
            fastcgi_param HTTPS on;
            fastcgi_pass web:9000;
            fastcgi_read_timeout 120s;
        }
        location = /assets/app.js { }
        location = /assets/styles.css { }
        location / { return 404; }
    }
}
